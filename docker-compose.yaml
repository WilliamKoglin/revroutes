services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aggie
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: aggie_route
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://aggie:devpassword@db:5432/aggie_route

volumes:
  pgdata: